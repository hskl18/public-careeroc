# Version updates, grouped per ecosystem so each run is a handful of PRs: monthly, and weekly for
# the digest-pinned base images.
# Security updates are separate and arrive as soon as an advisory is published.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    ignore:
      # @vercel/otel declares these as peers (^2.1 and ^0.205), so they move when it does.
      - dependency-name: "@opentelemetry/*"
        update-types: [version-update:semver-major]
      # Next.js and typescript-eslint do not support TypeScript 7 yet.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
    groups:
      npm:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: uv
    directory: /services/agent-runtime
    schedule:
      interval: monthly
    groups:
      uv:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: monthly
    groups:
      nuget:
        patterns: ["*"]
        update-types: [minor, patch]

  # Base images are pinned by digest, so security patches arrive only through these updates.
  - package-ecosystem: docker
    directories:
      - /apps/api
      - /apps/web
      - /services/agent-runtime
    schedule:
      interval: weekly
    groups:
      docker:
        patterns: ["*"]
    # Digest refreshes only: a new Python or a new major (node, .NET) must move with CI's versions
    # in one deliberate change, not ride along with security patches.
    ignore:
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Compose's own images. Postgres stays on its major version: a new major cannot read the pg17 volume.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: monthly
    ignore:
      - dependency-name: postgres
        update-types: [version-update:semver-major]

  - package-ecosystem: dotnet-sdk
    directory: /
    schedule:
      interval: monthly
