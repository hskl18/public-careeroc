name: CI

on:
  pull_request:
  push:
    branches:
      - main
    # A version tag runs every check first, then publishes the container images.
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
  PNPM_VERSION: 10.34.9
  NODE_VERSION: 26
  AUTH_URL: https://careeroc.example.com
  NEXTAUTH_URL: https://careeroc.example.com

jobs:
  agent-runtime:
    name: LangGraph runtime lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: careeroc_agent_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d careeroc_agent_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      CAREEROC_AGENT_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/careeroc_agent_test

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Install uv
        run: python -m pip install uv==0.13.6

      - name: Install locked agent runtime dependencies
        working-directory: services/agent-runtime
        run: uv sync --locked --all-groups

      - name: Lint agent runtime
        working-directory: services/agent-runtime
        run: uv run ruff check . && uv run ruff format --check .

      - name: Test agent runtime
        working-directory: services/agent-runtime
        run: uv run pytest

  docs:
    name: Docs links and naming
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Most review findings were stale docs, so relative links and anchors are checked like code.
      - name: Check relative links and anchors in Markdown
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --offline --include-fragments --no-progress './**/*.md'
          fail: true

      - name: Keep the old product name out
        run: |
          if git grep -niE 'career[-_ .]?os\b' -- . ':!pnpm-lock.yaml' ':!**/uv.lock'; then
            echo "The product is careeroc; the old name must not come back." >&2
            exit 1
          fi

  deployment-config:
    name: Deployment config validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: v4.3.1
      - name: Check every version file matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          expected="${TAG#v}"
          found=$(printf '%s\n' \
            "chart $(sed -n 's/^appVersion: *"\{0,1\}\([^"]*\)"\{0,1\}$/\1/p' deploy/helm/careeroc/Chart.yaml)" \
            "dotnet $(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props)" \
            "runtime $(sed -n 's/^version = "\(.*\)"$/\1/p' services/agent-runtime/pyproject.toml)" \
            "web $(jq -r .version apps/web/package.json)")
          echo "$found"
          if printf '%s\n' "$found" | grep -v " $expected\$"; then
            echo "These do not match the tag $TAG." >&2
            exit 1
          fi

      - name: Check the tag is on main
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        # A tag on an unreviewed branch would still publish images and move `latest`.
        run: |
          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$GITHUB_SHA" --jq .status)
          if [ "$status" != "identical" ] && [ "$status" != "behind" ]; then
            echo "$GITHUB_REF_NAME points at a commit that is not on main ($status)." >&2
            exit 1
          fi

      - name: Lint and validate the Helm chart
        run: |
          curl -fsSLo kubeconform.tar.gz https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz
          echo "9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883  kubeconform.tar.gz" | sha256sum --check
          tar -xzf kubeconform.tar.gz kubeconform
          helm lint deploy/helm/careeroc
          helm template careeroc deploy/helm/careeroc | ./kubeconform -strict -summary
          helm template careeroc deploy/helm/careeroc --set demoMode=false --set allowedEmailDomains=example.com | ./kubeconform -strict -summary
          helm template careeroc deploy/helm/careeroc --set networkPolicy.enabled=true | ./kubeconform -strict -summary

  compose-smoke:
    name: Docker Compose demo smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Start the demo stack
        run: docker compose --profile full up -d --build --wait --wait-timeout 600

      - name: Run the demo smoke test
        run: scripts/smoke-demo.sh

      - name: Show service logs
        if: failure()
        run: docker compose --profile full logs --tail 200

  kubernetes-smoke:
    name: Helm chart smoke test on kind
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: v4.3.1
      - name: Create kind cluster
        uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        with:
          cluster_name: careeroc-smoke

      - name: Build images and load them into kind
        run: |
          docker build -t careeroc/api:smoke -f apps/api/Dockerfile .
          docker build -t careeroc/web:smoke -f apps/web/Dockerfile .
          docker build -t careeroc/agent-runtime:smoke services/agent-runtime
          for service in api web agent-runtime; do
            kind load docker-image "careeroc/${service}:smoke" --name careeroc-smoke
          done

      - name: Install the chart and run the demo smoke test
        run: scripts/smoke-kubernetes.sh

  backend:
    name: Backend test and publish
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: careeroc
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d careeroc"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      ConnectionStrings__Careeroc: Host=localhost;Port=5432;Database=careeroc;Username=postgres;Password=postgres
      CAREEROC_TEST_POSTGRES: Host=localhost;Port=5432;Database=postgres;Username=postgres;Password=postgres

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: 10.0.x

      - name: Restore backend dependencies
        run: dotnet restore Careeroc.sln

      - name: Run backend tests
        run: dotnet test Careeroc.sln --configuration Release --no-restore

      - name: Publish API artifact
        run: dotnet publish apps/api/Careeroc.Api.csproj --configuration Release --no-restore --output "$RUNNER_TEMP/careeroc-api-publish"

      - name: Upload API publish output
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: careeroc-api-publish
          path: ${{ runner.temp }}/careeroc-api-publish
          retention-days: 3

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint frontend
        run: pnpm --dir apps/web lint

      - name: Run frontend unit tests
        run: pnpm --dir apps/web test:unit

      - name: Build frontend
        env:
          AUTH_SECRET: ci-build-only-auth-secret-do-not-use-in-production
          NEXTAUTH_SECRET: ci-build-only-auth-secret-do-not-use-in-production
          AUTH_GOOGLE_ID: ci-build-only-google-client-id
          AUTH_GOOGLE_SECRET: ci-build-only-google-client-secret
          ACCESS_ALLOWED_DOMAINS: example.com
        run: pnpm --dir apps/web build

      - name: Check frontend bundle budget
        run: pnpm --dir apps/web bundle:budget

      - name: Install Playwright browser
        run: pnpm --dir apps/web exec playwright install --with-deps chromium

      - name: Test the hosted read-only demo
        env:
          DEMO_MODE: "true"
          DEMO_SNAPSHOT: "true"
          AUTH_SECRET: ci-build-only-auth-secret-do-not-use-in-production
          AUTH_URL: http://localhost:3000
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          CAREEROC_HOSTED_DEMO_E2E: "1"
          PLAYWRIGHT_SKIP_WEB_SERVER: "1"
        run: |
          pnpm --dir apps/web build
          pnpm --dir apps/web exec next start -p 3000 > "$RUNNER_TEMP/web.log" 2>&1 &
          web_pid="$!"
          trap 'kill "$web_pid" 2>/dev/null || true' EXIT
          curl -fsS -o /dev/null --retry 30 --retry-delay 1 --retry-all-errors http://localhost:3000/
          pnpm --dir apps/web exec playwright test e2e/hosted-demo.spec.ts --workers=1

  contract:
    name: API contract drift
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - backend

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: careeroc
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d careeroc"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      ConnectionStrings__Careeroc: Host=localhost;Port=5432;Database=careeroc;Username=postgres;Password=postgres

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: 10.0.x

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Download API publish output
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: careeroc-api-publish
          path: ${{ runner.temp }}/careeroc-api-publish

      - name: Check OpenAPI TypeScript schema drift
        env:
          ASPNETCORE_ENVIRONMENT: Development
          DOTNET_ENVIRONMENT: Development
          SyncWorker__Enabled: "false"
          Database__ApplyMigrationsOnStartup: "true"
        run: |
          dotnet "$RUNNER_TEMP/careeroc-api-publish/Careeroc.Api.dll" --urls http://localhost:5114 > "$RUNNER_TEMP/careeroc-api.log" 2>&1 &
          api_pid="$!"
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT

          for _ in {1..30}; do
            if curl -fsS http://localhost:5114/health > /dev/null; then
              pnpm --dir apps/web check:api
              exit 0
            fi
            sleep 1
          done

          cat "$RUNNER_TEMP/careeroc-api.log"
          exit 1

  multi-agent-e2e:
    name: Multi-agent full-stack E2E
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: careeroc_e2e
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d careeroc_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      CAREEROC_E2E_CONNECTION_STRING: Host=localhost;Port=5432;Database=careeroc_e2e;Username=postgres;Password=postgres

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: 10.0.x

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --dir apps/web exec playwright install --with-deps chromium

      - name: Run dedicated multi-agent E2E
        run: pnpm e2e:multi-agent

      - name: Upload E2E failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: multi-agent-e2e-failure
          path: |
            .artifacts/e2e/multi-agent/
            apps/web/test-results/
            apps/web/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  arm64-images:
    name: Image build (arm64, ${{ matrix.image.name }})
    # images.yml builds both architectures only after a tag. The Compose and kind jobs already build
    # amd64, so pull requests also build arm64 here, without pushing, to catch a broken build first.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        image:
          - { name: web, context: ., file: apps/web/Dockerfile }
          - { name: api, context: ., file: apps/api/Dockerfile }
          - { name: agent-runtime, context: services/agent-runtime, file: services/agent-runtime/Dockerfile }
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.file }}
          platforms: linux/arm64
          push: false

  images:
    name: Container images
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - agent-runtime
      - docs
      - deployment-config
      - compose-smoke
      - kubernetes-smoke
      - backend
      - frontend
      - contract
      - multi-agent-e2e
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/images.yml
