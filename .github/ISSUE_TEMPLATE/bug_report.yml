name: Bug report
description: Something does not work as the docs say.
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. docker compose --profile full up -d --wait
        2. Open the demo
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The release (the CAREEROC_VERSION value, such as 1.2.0) or the commit you built.
    validations:
      required: true
  - type: dropdown
    id: target
    attributes:
      label: Where it runs
      options:
        - Docker Compose
        - Kubernetes (Helm)
        - From source (scripts/dev-up.sh)
        - Hosted demo (careeroc.vercel.app)
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant log lines, with secrets and real email content removed.
      render: text
