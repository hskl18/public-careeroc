{{- /*
Services keep the short names the apps already use (http://api:8080, http://agent-runtime:8123),
so install one release per namespace.
*/ -}}
{{- if and (not .Values.demoMode) (not .Values.allowedEmails) (not .Values.allowedEmailDomains) }}
{{- fail "Set allowedEmails or allowedEmailDomains when demoMode is false, or nobody can sign in." }}
{{- end }}
{{- $root := . -}}
{{- $publicUrl := include "careeroc.publicUrl" . -}}
{{- /* callers: the release's pods that call this service, for networkPolicy. */ -}}
{{- $components := dict
  "web" (dict "port" 3000 "ready" "/" "live" "/" "values" .Values.web "callers" (list))
  "api" (dict "port" 8080 "ready" "/health/ready" "live" "/health" "values" .Values.api "callers" (list "web" "agent-runtime"))
  "agent-runtime" (dict "port" 8123 "ready" "/health/ready" "live" "/health" "values" .Values.agentRuntime "callers" (list "api"))
-}}
{{- range $name, $component := $components }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "careeroc.labels" $root | nindent 4 }}
    app.kubernetes.io/name: {{ $name }}
spec:
  replicas: {{ $component.values.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
  template:
    metadata:
      labels:
        {{- include "careeroc.labels" $root | nindent 8 }}
        app.kubernetes.io/name: {{ $name }}
    spec:
      automountServiceAccountToken: false
      {{- if eq $name "agent-runtime" }}
      # A review can run for 100 seconds; let it finish before the pod is killed.
      terminationGracePeriodSeconds: 110
      {{- end }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: {{ $name }}
          image: "{{ $root.Values.images.registry }}/{{ $name }}:{{ $root.Values.images.tag | default $root.Chart.AppVersion }}"
          imagePullPolicy: {{ $root.Values.images.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ $component.port }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          {{- $env := include "careeroc.env" (dict "root" $root "name" $name "port" $component.port "publicUrl" $publicUrl) | fromYamlArray }}
          {{- $chartEnvNames := list }}
          {{- range $env }}
          {{- $chartEnvNames = append $chartEnvNames .name }}
          {{- end }}
          {{- range $component.values.extraEnv }}
          {{- if has .name $chartEnvNames }}
          {{- fail (printf "extraEnv for %s sets %s, which the chart already sets; use the chart's own value for it." $name .name) }}
          {{- end }}
          {{- end }}
          env:
            {{- toYaml (concat $env ($component.values.extraEnv | default list)) | nindent 12 }}
          # Readiness includes the database; liveness does not, so an outage never restarts pods.
          readinessProbe:
            httpGet: { path: {{ $component.ready }}, port: http }
            periodSeconds: 10
            # A readiness check waits on the database; the runtime's gives up after 3 seconds.
            timeoutSeconds: 5
          livenessProbe:
            httpGet: { path: {{ $component.live }}, port: http }
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            {{- toYaml $component.values.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "careeroc.labels" $root | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: {{ $name }}
  ports:
    - name: http
      port: {{ $component.port }}
      targetPort: http
{{- if $root.Values.networkPolicy.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}
  labels:
    {{- include "careeroc.labels" $root | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
  policyTypes: [Ingress]
  ingress:
    - ports:
        - port: http
      from:
        - namespaceSelector:
            matchLabels:
              {{- toYaml $root.Values.networkPolicy.ingressControllerNamespaceLabels | nindent 14 }}
        {{- range $component.callers }}
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ . }}
        {{- end }}
        {{- with $root.Values.networkPolicy.extraFrom }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
{{- end }}
{{- end }}
