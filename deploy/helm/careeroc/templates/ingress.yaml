{{- /* One host, and paths pick the service. */ -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: careeroc
  labels:
    {{- include "careeroc.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - hosts: [{{ .Values.host | quote }}]
      secretName: {{ .Values.ingress.tlsSecretName }}
  rules:
    - host: {{ .Values.host | quote }}
      http:
        paths:
          {{- range $path := list "/mcp" "/agent" }}
          - path: {{ $path }}
            pathType: Prefix
            backend: { service: { name: api, port: { name: http } } }
          {{- end }}
          - path: /a2a
            pathType: Prefix
            backend: { service: { name: agent-runtime, port: { name: http } } }
          # ingress-nginx refuses a Prefix path with a dot (strict-validate-path-type), and that would
          # reject the whole Ingress; ImplementationSpecific is matched as a prefix there too.
          - path: /.well-known/agent-card.json
            pathType: ImplementationSpecific
            backend: { service: { name: agent-runtime, port: { name: http } } }
          - path: /
            pathType: Prefix
            backend: { service: { name: web, port: { name: http } } }
