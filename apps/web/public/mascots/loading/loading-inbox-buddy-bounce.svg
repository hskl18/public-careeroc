<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc" shape-rendering="crispEdges">
  <title id="title">Loading Inbox Buddy</title>
  <desc id="desc">Pixel inbox buddy gently bouncing while loading.</desc>
  <style>
    .buddy { animation: bob 1.2s steps(2, end) infinite; }
    .eye-shine { animation: blink 3.6s steps(1, end) infinite; }
    .dot-a { animation: dot 1.2s steps(1, end) infinite; }
    .dot-b { animation: dot 1.2s steps(1, end) .2s infinite; }
    .dot-c { animation: dot 1.2s steps(1, end) .4s infinite; }
    .shadow { animation: shadow 1.2s steps(2, end) infinite; transform-origin: 64px 106px; }
    @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
    @keyframes blink { 0%, 82%, 100% { opacity: 1; } 84%, 90% { opacity: 0; } }
    @keyframes dot { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }
    @keyframes shadow { 0%, 100% { transform: scaleX(1); opacity: .35; } 50% { transform: scaleX(.75); opacity: .18; } }
    @media (prefers-reduced-motion: reduce) {
      .buddy, .eye-shine, .dot-a, .dot-b, .dot-c, .shadow { animation: none; }
    }
  </style>
  <g class="shadow">
    <rect x="38" y="108" width="52" height="6" fill="#dbeafe"/>
  </g>
  <g class="buddy">
    <rect x="28" y="42" width="72" height="52" fill="#2563eb"/>
    <rect x="36" y="50" width="56" height="12" fill="#dbeafe"/>
    <rect x="36" y="62" width="28" height="20" fill="#bfdbfe"/>
    <rect x="64" y="62" width="28" height="20" fill="#93c5fd"/>
    <rect x="44" y="34" width="12" height="12" fill="#0f172a"/>
    <rect x="72" y="34" width="12" height="12" fill="#0f172a"/>
    <g class="eye-shine">
      <rect x="46" y="36" width="6" height="6" fill="#ffffff"/>
      <rect x="74" y="36" width="6" height="6" fill="#ffffff"/>
    </g>
    <rect x="52" y="76" width="24" height="8" fill="#0f172a"/>
    <rect x="20" y="58" width="8" height="24" fill="#2563eb"/>
    <rect x="100" y="58" width="8" height="24" fill="#2563eb"/>
    <rect x="42" y="94" width="14" height="8" fill="#1e40af"/>
    <rect x="72" y="94" width="14" height="8" fill="#1e40af"/>
    <rect x="40" y="28" width="16" height="6" fill="#16a34a"/>
    <rect x="72" y="28" width="16" height="6" fill="#16a34a"/>
  </g>
  <rect class="dot-a" x="48" y="116" width="6" height="6" fill="#2563eb"/>
  <rect class="dot-b" x="61" y="116" width="6" height="6" fill="#16a34a"/>
  <rect class="dot-c" x="74" y="116" width="6" height="6" fill="#16a34a"/>
</svg>
