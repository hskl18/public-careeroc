<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc" shape-rendering="crispEdges">
  <title id="title">Resume Scan Loading</title>
  <desc id="desc">Pixel inbox buddy scanning a resume page.</desc>
  <style>
    .buddy { animation: bob 1.6s steps(2, end) infinite; }
    .resume { animation: float-card 1.6s steps(2, end) infinite; }
    .scan { animation: scan 1.2s steps(4, end) infinite; }
    .eye-shine { animation: blink 4.2s steps(1, end) infinite; }
    @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
    @keyframes float-card { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-2px); } }
    @keyframes scan { 0% { transform: translateY(0); } 100% { transform: translateY(22px); } }
    @keyframes blink { 0%, 88%, 100% { opacity: 1; } 90%, 94% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .buddy, .resume, .scan, .eye-shine { animation: none; }
    }
  </style>
  <g class="buddy">
    <rect x="22" y="46" width="66" height="48" fill="#2563eb"/>
    <rect x="30" y="54" width="50" height="10" fill="#dbeafe"/>
    <rect x="30" y="64" width="25" height="18" fill="#bfdbfe"/>
    <rect x="55" y="64" width="25" height="18" fill="#93c5fd"/>
    <rect x="36" y="38" width="10" height="10" fill="#0f172a"/>
    <rect x="62" y="38" width="10" height="10" fill="#0f172a"/>
    <g class="eye-shine">
      <rect x="38" y="40" width="5" height="5" fill="#ffffff"/>
      <rect x="64" y="40" width="5" height="5" fill="#ffffff"/>
    </g>
    <rect x="46" y="78" width="18" height="6" fill="#0f172a"/>
    <rect x="16" y="62" width="6" height="20" fill="#2563eb"/>
    <rect x="38" y="96" width="12" height="8" fill="#1e40af"/>
    <rect x="60" y="96" width="12" height="8" fill="#1e40af"/>
  </g>
  <g class="resume">
    <rect x="82" y="36" width="32" height="48" fill="#ffffff"/>
    <rect x="106" y="36" width="8" height="8" fill="#dcfce7"/>
    <rect x="88" y="48" width="16" height="3" fill="#16a34a"/>
    <rect x="88" y="58" width="18" height="3" fill="#16a34a"/>
    <rect x="88" y="68" width="12" height="3" fill="#16a34a"/>
    <rect class="scan" x="86" y="46" width="24" height="4" fill="#60a5fa" opacity=".65"/>
  </g>
</svg>
